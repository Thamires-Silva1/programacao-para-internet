<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(white, lightblue);
    }

    /* NUVEM */
    .nuvem {
      position: absolute;
      top: 50px;
      left: 0;
      width: 100px;
      height: 40px;
      background: white;
      border-radius: 40px;
      box-shadow: 40px -15px 0 white;
      animation: nuvem 30s linear infinite;
    }

    @keyframes nuvem {
      from { left: -150px; }
      to   { left: 100%; }
    }

    /* BARCO */
    .barco {
      position: absolute;
      bottom: 30%;
      left: 0;
      width: 100px;
      height: 100px;
      background-image: url("barco.svg");
      background-size: contain;
      background-repeat: no-repeat;
      z-index: 2;
      animation: andar 15s linear infinite, balancar 3s ease-in-out infinite;
    }

    @keyframes andar {
      from { left: -150px; }
      to   { left: 100%; }
    }

    @keyframes balancar {
      0%   { transform: rotate(-5deg); }
      50%  { transform: rotate(5deg); }
      100% { transform: rotate(-5deg); }
    }

    /* MAR */
    .mar {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 35%;
      background: royalblue;
      z-index: 1;
    }

.mar::before {
  content: "";
  position: absolute;
  top: -15px;
  width: 100%;
  height: 30px;
  background: radial-gradient(circle at 25px 30px, royalblue 24px, transparent 25px);
  background-size: 50px 30px;
  animation: ondas 2s linear infinite;
}

@keyframes ondas {
  from { background-position: 0 0; }
  to   { background-position: 50px 0; }
}
  </style>
</head>
<body>
  <div class="nuvem"></div>
  <div class="barco"></div>
  <div class="mar"></div>
</body>
</html>
