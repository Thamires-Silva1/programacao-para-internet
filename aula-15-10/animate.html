<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀🦄</title>
    <style>
        #rocket{
            position: fixed;
            animation: lancamento 10s linear 0s infinite;
        }
        @keyframes lancamento {
            0%{
                top: 100vh;
            }
            100%{
                top: -10vh;
            }

        }
        #unicorn{
            width: 50px;
            animation: flip 2s cubic-bezier(.04,2.16,.86,-0.75) 0s 5;
        }
        @keyframes flip {
            0%{
                transform: rotate(0deg);
            }   
            100%{
                transform: rotate(360deg);
            }         
        }
    </style>
</head>
<body>
    <p id="unicorn">🦄</p>
    <p id="rocket">🚀</p>
</body>
</html>
