<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisão</title>
    <style>
        * {
            border: 1px solid black;
            font-size: 25px;
        }
        div {
            width: 50px;
            height: 50px;
            display: inline-block;
        }
        .container {
            position: relative;
        }
        #a {
            position: fixed;
            bottom: 0px;
            left: 0px;
            background-color: #FF0000FF;
            z-index: 1;
        }
        #b {
            position: absolute;
            top: 0px;
        }
    </style>
</head>
<body>
    <span>Aula bla</span>
    <input type="text" placeholder="entre com seus dados bancários">
    <p> &gt; &lt; <span>Olá mundão &nbsp; &nbsp; &nbsp; <mark>perdido</mark></span></p> 
    <p>Elementos tipo inline não forçam a quebra de linha.</p>

    <div class="container">
        <div id="a">A</div><div id="b">B</div>
    </div>

        div.container>div.box.letra#box${$}*10
</body>
</html>
