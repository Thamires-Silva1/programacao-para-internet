<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            font-weight: bold;
            text-align: center;
            color: white;
        }
        .topo {
            height: 18%;
            background-color: #262626;
            display: flex;
            align-items: center;
            padding: 30px;
            gap: 10px;
        }
        .circulo {
            width: 30px;
            height: 30px;
            background-color: #00b8b0;
            border-radius: 50%;
        }
        .principal {
            display: flex;
            flex: 1;
        }
        nav {
            width: 23%;
            background-color: #fa8731;
            padding: 15px;
        }
        .direita {
            width: 77%;
            display: flex;
            flex-direction: column;
        }
        header {
            height: 15%;
            background-color: #00a9d6;
            padding: 15px;
        }
        main {
            flex: 1;
            background-color: #62509a;
            padding: 15px;
        }
        footer {
            height: 16%;
            background-color: #0d94ba;
            padding: 15px;
        }
    </style>
</head>
<body>
    <div class="topo">
        <div class="circulo"></div>
        <div class="circulo"></div>
        <div class="circulo"></div>
    </div>

    <div class="principal">
        <nav>NAVEGAÇÃO</nav>

        <div class="direita">
            <header>CABEÇALHO</header>
            <main>CONTEÚDO</main>
            <footer>RODAPÉ</footer>
        </div>
    </div>
</body>
</html>
