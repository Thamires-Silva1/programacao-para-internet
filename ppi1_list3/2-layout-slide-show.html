<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .slide {
        display: flex;
        width: 90%;
        height: 300px;
        gap: 10px;
    }
    .imagem {
        flex: 1;
        border-radius: 20px;
        overflow: hidden;
        transition: 0.5s;
    }
    .imagem:hover {
        flex: 5;
    }
    .imagem img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    </style>
</head>
<body>
    <div class="slide">
        <div class="imagem">
            <img src="https://picsum.photos/id/1018/600/400">
        </div>
        <div class="imagem">
            <img src="https://picsum.photos/id/1016/600/400">
        </div>
        <div class="imagem">
            <img src="https://picsum.photos/id/1039/600/400">
        </div>
        <div class="imagem">
            <img src="https://picsum.photos/id/1043/600/400">
        </div>
    </div>
</body>
</html>
