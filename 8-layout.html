
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 8</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #eeeeee;
        }

        .container {
            display: grid;
            width: 80vw;
            height: 70vh;
            gap: 5px;
            padding: 10px;
            background-color: white;

            grid-template-columns: 10% 40% 20% 30%;
            grid-template-rows: repeat(3, 1fr);
        }

        .item1 {
            background-color: #b4c6df;
            grid-column: 2 / 4;
        }

        .item2 {
            background-color: #ffb536;
            grid-column: 4;
            grid-row: 1 / 3;
        }

        .item3 {
            background-color: #d7b0ad;
            grid-column: 1 / 3;
            grid-row: 2;
        }

        .item4 {
            background-color: #c5dddd;
            grid-column: 3;
            grid-row: 2;
        }

        .item5 {
            background-color: #f4b6a5;
            grid-column: 1 / 3;
            grid-row: 3;
        }

        .item6 {
            background-color: #b7cb73;
            grid-column: 3 / 5;
            grid-row: 3;
        }

        .bolinhas {
            grid-column: 1;
            grid-row: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
        }

        .bola {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background-color: #ff9b55;
        }

        .bola:nth-child(2) {
            background-color: #b7cb73;
        }

        .bola:nth-child(3) {
            background-color: #d5c4e5;
        }

        @media screen and (max-width: 500px) {
            .container {
                width: 95vw;
                height: 90vh;
                grid-template-columns: 1fr 1fr;
                grid-template-rows: repeat(4, 1fr);
            }

            .bolinhas {
                grid-column: 1;
                grid-row: 1;
            }

            .item1 {
                grid-column: 2;
                grid-row: 1;
            }

            .item2 {
                grid-column: 1;
                grid-row: 2;
            }

            .item3 {
                grid-column: 2;
                grid-row: 2;
            }

            .item4 {
                grid-column: 1;
                grid-row: 3;
            }

            .item5 {
                grid-column: 2;
                grid-row: 3;
            }

            .item6 {
                grid-column: 1 / 3;
                grid-row: 4;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="bolinhas">
            <div class="bola"></div>
            <div class="bola"></div>
            <div class="bola"></div>
        </div>

        <div class="item1"></div>
        <div class="item2"></div>
        <div class="item3"></div>
        <div class="item4"></div>
        <div class="item5"></div>
        <div class="item6"></div>

    </div>

</body>
</html>
