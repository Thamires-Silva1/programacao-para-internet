
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 4 - Layout Adaptativo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial;
            font-weight: bold;
            text-align: center;
        }

        .container {
            display: grid;
            width: 100vw;
            height: 100vh;
            padding: 10px;
            gap: 10px;

            grid-template-columns: 15% 1fr 15%;
            grid-template-rows: 10% 10% 1fr 10% 10%;
        }

        header {
            background-color: #f2b600;
            grid-column: 1 / 4;
            padding: 15px;
        }

        .banner {
            background-color: #d9392b;
            grid-column: 2;
            padding: 15px;
        }

        .esquerda {
            background-color: #0e9850;
            grid-column: 1;
            grid-row: 2 / 5;
            padding: 15px;
        }

        main {
            background-color: #4285ee;
            grid-column: 2;
            grid-row: 3;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .direita {
            background-color: #f2b600;
            grid-column: 3;
            grid-row: 2 / 5;
            padding: 15px;
        }

        .baixo {
            background-color: #0e9850;
            grid-column: 2;
            grid-row: 4;
            padding: 15px;
        }

        footer {
            background-color: #4285ee;
            grid-column: 1 / 4;
            padding: 15px;
        }

        @media screen and (max-width: 600px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-rows: 60px 60px 60px 1fr 60px 60px 60px;
            }

            header, .banner, .esquerda, main,
            .direita, .baixo, footer {
                grid-column: 1;
                grid-row: auto;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <header>Header</header>

        <div class="banner">Banner</div>

        <aside class="esquerda">Left Aside</aside>

        <main>
            Main Content
        </main>

        <aside class="direita">Right Aside</aside>

        <div class="baixo">Low Content</div>

        <footer>Footer</footer>

    </div>

</body>
</html>
