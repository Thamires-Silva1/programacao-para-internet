<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box</title>

    <style>
        * {
            border: 1px solid black;
        }
        html {
            background-color: gray;
            padding: 0px;
            margin: 0px
        }
        body {
            background-color: beige;
            margin: 0px;
        }
        p{
            display: inline-block;
            width: 100px;
            height: 100px;
            padding: 10px;
            outline: 2px dotted purple;
            outline-offset: 40px;
            background-image:url("./imgs/Star-Trek-Logo.png");
            
            background-size: contain;
            background-repeat: no-repeat;
            background-position: 0px 50px;
        }
        #Iasmin {
            margin: 50px;
            border-top-color: red;
        }
        span {
            line-height: 50px;
        }
    </style>
</head>
<body>
    <p>Thiago </p><p>Pedro</p>
    <p id="Iasmin">Iasmin</p>
    <span>Ezequiel</span>
    <span>Y</span>
    <span>P</span>
</body>
</html>
